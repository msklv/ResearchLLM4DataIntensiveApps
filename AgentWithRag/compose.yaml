name: tei-qdrant

services:
  tei-cpu:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    container_name: tei-embedding-cpu
    platform: linux/amd64
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "${TEI_PORT:-9090}:80"
    volumes:
      - tei_data:/data
    command:
      - --model-id
      - "${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      - --hostname
      - "0.0.0.0"

  tei-gpu:
    image: ghcr.io/huggingface/text-embeddings-inference:1.9.3
    container_name: tei-embedding-gpu
    platform: linux/amd64
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${TEI_PORT:-9090}:80"
    volumes:
      - tei_data:/data
    command:
      - --model-id
      - "${TEI_MODEL:-Qwen/Qwen3-Embedding-0.6B}"
      - --hostname
      - "0.0.0.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-cpu:
    image: ollama/ollama:0.30.9
    container_name: ollama-cpu
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_LOAD_TIMEOUT: "${OLLAMA_LOAD_TIMEOUT:-10m}"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
    command: ["serve"]

  ollama-gpu:
    image: ollama/ollama:0.30.9
    container_name: ollama-gpu
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    environment:
      OLLAMA_LOAD_TIMEOUT: "${OLLAMA_LOAD_TIMEOUT:-10m}"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 20
    command: ["serve"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama-pull-cpu:
    image: ollama/ollama:0.30.9
    container_name: ollama-pull-cpu
    profiles: ["cpu"]
    depends_on:
      ollama-cpu:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama-cpu:${OLLAMA_PORT:-11434}"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL}"

  ollama-pull-gpu:
    image: ollama/ollama:0.30.9
    container_name: ollama-pull-gpu
    profiles: ["gpu"]
    depends_on:
      ollama-gpu:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama-gpu:${OLLAMA_PORT:-11434}"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL}"
      
  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333" # REST/HTTP API, основной порт для большинства интеграций.
      - "6334:6334" # gRPC API
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
    volumes:
      - ./qdrant_data:/qdrant/storage

configs:
  qdrant_config:
    content: |
      log_level: INFO

volumes:
  tei_data:
  ollama_data:
